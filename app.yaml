command:
  - "gunicorn"
  - "app:app"
  - "--bind"
  - "0.0.0.0:8000"
  - "--workers"
  - "1"
  - "--timeout"
  - "120"

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"

resources:
  - name: requirements.txt
    type: pip_requirements