command:
  - "streamlit"
  - "run"
  - "app.py"
  - "--server.port=$APP_PORT"
  - "--server.address=0.0.0.0"
  - "--server.headless=true"

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"

resources:
  - name: requirements.txt
    type: pip_requirements